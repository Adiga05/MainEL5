version: '3.8'

services:
  # ── PostgreSQL with PostGIS Extension ──────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: civix_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-civix_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./CIVIX/backend/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-civix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend API & ML Service ───────────────────────────────
  backend:
    build:
      context: ./CIVIX/backend
      dockerfile: Dockerfile
    container_name: civix_backend_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@db:5432/${POSTGRES_DB:-civix_db}
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-urban-flood-system-secret-key-2024}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./CIVIX/backend/models:/app/models
      - ./CIVIX/backend/data:/app/data

  # ── React + Vite Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./CIVIX/frontend
      dockerfile: Dockerfile
    container_name: civix_frontend_ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgis_data:
    driver: local
